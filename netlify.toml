# Netlify build config for the RibhShare Expo Web SPA
# Repo layout: root is the Expo project (no /frontend subfolder).

[build]
  # Produce the static web bundle. Requires `output: "single"` in app.config.ts
  # so all routes land in one index.html and can be handled by expo-router.
  command = "npx expo export --platform web --output-dir dist"
  publish = "dist"

[build.environment]
  # Match the local dev node version. Bump this if you upgrade in package.json.
  NODE_VERSION = "20"

# SPA fallback: any path that Netlify can't resolve as a static file falls back
# to index.html so expo-router can render the correct screen client-side.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Never cache the HTML shell — a stale index.html keeps pointing at deleted
# hashed JS bundles (or old blank-screen builds) after deploys.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Hashed static assets can be cached forever.
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
